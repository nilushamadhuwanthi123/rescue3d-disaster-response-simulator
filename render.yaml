# Render Blueprint for the Rescue3D API.
#
# Deploy: on Render, "New +" -> "Blueprint", point it at this repo, and
# Render reads this file automatically. It creates the web service below;
# a few env vars are marked sync: false and must be filled in by hand in
# the Render dashboard after the first deploy (see notes on each one).
#
# MongoDB: Render does not offer a managed MongoDB. Use a free MongoDB
# Atlas cluster (Atlas -> Database -> free M0 tier, no card required) and
# paste its connection string into MONGODB_URI below.
services:
  - type: web
    name: rescue3d-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build:contracts && npm run build --workspace apps/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false # paste your MongoDB Atlas connection string here
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ALLOWED_ORIGINS
        value: https://nilushamadhuwanthi123.github.io
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 300
